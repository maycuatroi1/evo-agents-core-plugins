name: ci

# The plugins against evo-agents at the commit evo-agents.lock names: the static checks (make check) and every test,
# the hub's tests against a Postgres service container as evo-agents' CI runs them (make test). Runs on a pull request,
# on a push to main, and from release.yml before a release builds anything. compat.yml runs the same tests against
# evo-agents' main every night.
on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12" # the Python of the hub's image
      - uses: astral-sh/setup-uv@v10.2.0 # setup-uv tags releases only, no major tag
      - run: make setup
      - run: make lock
      - run: make check

  # The Postgres of the job is thrown away with it, so it keeps its data in memory (tmpfs) and writes nothing through:
  # every hub test creates a database from a template and drops it.
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --tmpfs /var/lib/postgresql/data
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      EVO_HUB_TEST_DSN: postgresql://postgres:test@localhost:5432/postgres
    steps:
      - name: Postgres without fsync
        run: >-
          docker exec ${{ job.services.postgres.id }} psql -U postgres -q
          -c "ALTER SYSTEM SET fsync = off" -c "ALTER SYSTEM SET synchronous_commit = off"
          -c "ALTER SYSTEM SET full_page_writes = off" -c "SELECT pg_reload_conf()"
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v10.2.0
      - run: make setup
      - run: make lock
      - run: make test PYTEST_ARGS="-n 4 --durations=20"
